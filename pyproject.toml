[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tourclaim-agent"
version = "0.3.0"
description = "Tour Claim AI Agent: a goal-oriented assistant that helps DFCCIL employees prepare and track tour claims through the .NET Tour API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "langgraph>=0.6,<2",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "aiosqlite>=0.20",
    "pyjwt[crypto]>=2.9,<3",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
postgres = ["langgraph-checkpoint-postgres>=2.0,<4", "psycopg[binary,pool]>=3.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tourclaim_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
# SIM905: word lists written as one string read better than long list literals.
ignore = ["SIM905"]
